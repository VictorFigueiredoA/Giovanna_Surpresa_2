<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um quadro para o seu dia</title>
<style>
:root{--bg:#fff1e3;--ink:#4a2433;--soft:#8a5a68;--frame:#e8a33d;--mat:#fff9f2;--pink:#e85d8a;--card:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#ffe9ef;--soft:#e0aab9;--mat:#fff3ea;--card:#3a2230}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#ffd9b8 0%,transparent 60%),var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:clamp(2rem,8vw,3rem);margin:0 0 6px;text-align:center;color:var(--pink)}
.sub{margin:0 0 26px;color:var(--soft);text-align:center;font-size:1.05rem}
.frame{position:relative;width:min(88vw,360px);padding:14px;border-radius:6px;background:linear-gradient(135deg,#f6c65b,#d98d1f 55%,#f3bd4c);box-shadow:0 18px 40px rgba(120,60,20,.35),inset 0 0 0 2px rgba(255,255,255,.35);transform:rotate(-1.2deg)}
.mat{background:var(--mat);padding:16px;box-shadow:inset 0 0 12px rgba(0,0,0,.15)}
.mat img{display:block;width:100%;height:auto;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cap{font-family:"Pacifico","Brush Script MT",cursive;text-align:center;color:#6b3a2a;margin:12px 0 0;font-size:1.15rem}
.msg{margin:30px 0 14px;max-width:420px;min-height:5.5em;text-align:center;font-size:1.25rem;line-height:1.45;font-weight:600}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,.btn:focus-visible,input:focus-visible+label{outline:3px solid var(--ink);outline-offset:3px}
.more{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(232,93,138,.4)}
.more:active{transform:scale(.97)}
.music{margin-top:30px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card);padding:18px 20px;border-radius:18px;max-width:420px;width:100%;box-shadow:0 6px 20px rgba(120,60,20,.15)}
.music p{margin:0;text-align:center;color:var(--soft);font-size:.95rem}
.listen{background:#1d1d1f;color:#fff}
.file{background:transparent;color:var(--ink);border:2px solid var(--soft)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
audio{width:100%;margin-top:4px;display:none}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up 6s linear forwards;font-size:22px}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}}
</style></head>
<body>
<h1>Pra alegrar o seu dia</h1>

<script>
var msgs=[
